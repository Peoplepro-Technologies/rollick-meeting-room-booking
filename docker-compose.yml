services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: rollick-meeting-room-booking:latest
    container_name: meeting-room-booking
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: "5000"
      JWT_SECRET: ${JWT_SECRET:-please-change-this-jwt-secret-in-production}
      DATABASE_URL: /data/database.sqlite
      UPLOADS_DIR: /data/uploads
    volumes:
      - meeting-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  meeting-data:
